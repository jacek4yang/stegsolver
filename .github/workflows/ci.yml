name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show the toolchain
        run: |
          java -version
          mvn -version

      - name: Build and run the tests
        run: mvn -B -ntp --no-transfer-progress verify

      - name: Check that no Swing component slipped in
        shell: bash
        run: |
          if grep -rn "javax\.swing\|java\.awt\.BorderLayout\|JOptionPane\|JFileChooser" \
              src/main/java src/test/java src/bench/java; then
            echo "Swing usage found: the user interface must be JavaFX only." >&2
            exit 1
          fi
          echo "No Swing usage found."

      - name: Compile the benchmarks
        run: mvn -B -ntp --no-transfer-progress -Pbench test-compile

      # Runs every engine layer in a forked JVM through Maven, so the step needs no shell syntax and
      # behaves identically on Windows and Linux.
      - name: Run the engine self test (no display needed)
        run: mvn -B -ntp --no-transfer-progress -Pself-test exec:exec

      - name: Prepare display integration tests
        run: mvn -B -ntp test-compile dependency:build-classpath '-Dmdep.outputFile=target/test-cp.txt' '-Dmdep.includeScope=test'

      - name: Test UI and screen capture on X11
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0
          xvfb-run -a --server-args="-screen 0 1600x1000x24" java -Dprism.order=sw -cp "target/classes:target/test-classes:$(cat target/test-cp.txt)" io.github.jacek4yang.stegsolver.ui.FxIntegrationCheck

      - name: Test UI and screen capture on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testCp = 'target/classes;target/test-classes;' + (Get-Content target/test-cp.txt -Raw).Trim()
          java '-Dprism.order=sw' -cp $testCp io.github.jacek4yang.stegsolver.ui.FxIntegrationCheck
          if ($LASTEXITCODE -ne 0) { throw 'UI integration check failed' }

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  smoke-test:
    name: Smoke test the application (Linux, X11 via Xvfb)
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install the virtual X server
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Compile and create a test image
        run: |
          mvn -B -ntp --no-transfer-progress -q compile dependency:build-classpath \
            -Dmdep.outputFile=target/cp.txt -Dmdep.includeScope=runtime
          cat > /tmp/MakeImage.java <<'JAVA'
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class MakeImage {
              public static void main(String[] args) throws Exception {
                  BufferedImage image = new BufferedImage(320, 200, BufferedImage.TYPE_INT_ARGB);
                  for (int y = 0; y < 200; y++) {
                      for (int x = 0; x < 320; x++) {
                          image.setRGB(x, y, 0xff000000 | (x << 8) | y);
                      }
                  }
                  ImageIO.write(image, "png", new File(args[0]));
              }
          }
          JAVA
          javac -d /tmp /tmp/MakeImage.java
          java -cp /tmp MakeImage target/smoke.png

      - name: Start the application, render a few transforms and exit
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            java -Dstegsolver.smokeTest=true -Dstegsolver.smokeSteps=4 \
              -Dprism.order=sw -cp "target/classes:$(cat target/cp.txt)" \
              io.github.jacek4yang.stegsolver.Launcher target/smoke.png
